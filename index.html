<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Bot</title>
    <!-- Set the theme before first paint to avoid a flash of the wrong one -->
    <script>
        (function () {
            var saved = null;
            try { saved = localStorage.getItem("theme"); } catch (e) { }
            var theme = saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="display-bg">
        <div class="chat-box">

            <header class="chat-header">
                <h1>AI Chatbot</h1>
                <div class="header-actions">
                    <span class="status">
                        <span class="status-dot"></span>
                        online
                    </span>
                    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light theme"
                        title="Toggle theme">
                        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="4" />
                            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                        </svg>
                        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
                        </svg>
                    </button>
                </div>
            </header>

            <div class="chat-area" id="chatArea">
                <div class="row row-user">
                    <!-- <div class="chat-user"></div> -->
                </div>
                <div class="row row-ai">
                    <div class="chat-ai">hello, how can I help you</div>
                </div>
            </div>

            <form class="input-area" id="chatForm">
                <input class="input" id="chatInput" type="text" placeholder="Type your message" autocomplete="off" />
                <button id="send-btn" class="input-btn" type="submit">Send</button>
            </form>

        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>

</html>
